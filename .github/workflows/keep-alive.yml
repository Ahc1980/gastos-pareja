# Supabase pausa los proyectos gratis tras 7 días sin actividad: esto hace una consulta cada 3 días.
name: Mantener Supabase activo
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:
permissions:
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        run: |
          curl -fsS "https://uxrdstqczuerdertbwbj.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: sb_publishable_js0WTqKysMJibQVLKXVl0g_2unpn4ck"
      # GitHub apaga las tareas programadas tras 60 días sin cambios en el repo: esto la mantiene encendida.
      - name: Mantener encendida esta tarea
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"
