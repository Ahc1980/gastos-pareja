<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gastos">
  <title>Gastos en pareja</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <div id="app"><div class="loading">Cargando…</div></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module">
    // Evita que el navegador muestre una versión vieja: cada apertura pide los archivos actualizados.
    const v = '?v=' + Date.now();
    document.head.insertAdjacentHTML('beforeend', `<link rel="stylesheet" href="styles.css${v}">`);
    import('./js/app.js' + v);
  </script>
</body>
</html>
